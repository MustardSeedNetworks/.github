# Fixture CI. Inert: GitHub reads workflows only from the repository root, so
# this file is never scheduled — it exists so the conformance gate has a
# compliant ci.yml to read when .github runs that gate against itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-node
      - name: Compile check
        run: go build ./...
      - name: Build
        run: |
          go build -trimpath \
            -ldflags="-X example.com/conformance-fixture/internal/version.Version=${VERSION}" \
            -o fixture ./cmd/fixture
      - name: Run govulncheck
        run: govulncheck ./...

  ci-complete:
    runs-on: ubuntu-latest
    needs:
      - lint
      - backend
    if: always()
    steps:
      - run: echo done
