name: CI Conformance

# Asserts that a repo's own gates are wired to gate: every ci.yml job is either
# in ci-complete's needs or documented as advisory, the enabled linters meet the
# repo's declared tier, tool installs are pinned, and the governance scripts
# exist.
#
# It runs the repo-local checks only — the script's repo-settings and
# branch-protection checks need a token with Administration:read, which is too
# much authority to hand every PR run for a lint job. Those two are org-config
# drift rather than anything a PR can introduce, so they belong in a scheduled
# org-level run instead. Passing no repo slug is what selects this mode.
#
# Call it with:
#
#   ci-conformance:
#     uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@<sha>  # vX.Y.Z
#
# and add `ci-conformance` to ci-complete's `needs:` so it can block a merge.

on:
  workflow_call:

permissions: {}

env:
  # The fleet pins one golangci-lint version everywhere, so this is not an input:
  # a per-caller override would let a repo read its linters through a different
  # version than it lints with. Bump in lockstep with the repos.
  GOLANGCI_VERSION: v2.12.2

jobs:
  ci-conformance:
    name: CI Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script and the policy are pinned differently on purpose (#22).
      #
      # Callers write `ci-conformance.yml@<sha>  # vX.Y.Z`, which used to pin the
      # workflow definition while the script and policy it ran were checked out
      # from this repo's default branch — so the pin implied an immutability it
      # did not provide, and a single commit here changed what executed in all
      # four repos with no per-repo review and no tag bump.
      #
      # The SCRIPT is code. A bug in it reds the entire fleet, including on
      # unrelated PRs, so it now resolves to the very commit the caller pinned.
      # The POLICY is data, and rolling it out to four repos at once is the
      # reason the shared policy exists at all — so it stays live.
      - name: Resolve the pinned script ref
        id: pin
        env:
          # job.workflow_sha is THIS reusable workflow's own commit. github.sha
          # is the caller's, which would defeat the point.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # An empty ref: is not an error to actions/checkout — it silently
          # resolves to the default branch, i.e. exactly the behaviour being
          # removed here. Fail loudly instead of regressing quietly.
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty; refusing to fall back to the default branch"
            exit 1
          fi
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the conformance script (pinned to this workflow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MustardSeedNetworks/.github
          ref: ${{ steps.pin.outputs.sha }}
          path: .conformance
          persist-credentials: false

      - name: Check out the conformance policy (deliberately live)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MustardSeedNetworks/.github
          path: .conformance-policy
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The script reads the enabled linters from this binary. It is a hard
      # requirement, not an optimisation: without it the linter-floor check
      # reports "not verified" and fails, rather than passing silently.
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"

      - name: Check CI conformance
        env:
          # Without this the script reads the policy sitting beside itself,
          # which is the pinned copy. The script refuses to start if this path
          # is missing rather than skipping the policy checks silently.
          CI_CONFORMANCE_POLICY_DIR: .conformance-policy/policy
        run: python3 .conformance/scripts/check-ci-conformance.py
