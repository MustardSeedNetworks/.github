# Fleet-shared reusable license-compliance gate for seed / stem / niac.
# Each repo calls it from a thin .github/workflows/license-check.yml wrapper:
#
#   jobs:
#     license-check:
#       uses: MustardSeedNetworks/.github/.github/workflows/license-check.yml@main
#       with:
#         extra_go_ignores: "modernc.org/mathutil"   # optional, comma-separated
#
# Always ignored: the self module, github.com/MustardSeedNetworks/foundation
# (our own BUSL-1.1 module, which go-licenses cannot classify), and
# modernc.org/mathutil (a BSD-3-Clause transitive dep of modernc.org/sqlite
# that go-licenses reliably fails to classify — used fleet-wide). Real
# third-party GPL/AGPL/SSPL contamination still fails the build.
name: License Compliance (reusable)

on:
  workflow_call:
    inputs:
      extra_go_ignores:
        description: "Comma-separated extra Go module paths to ignore (beyond self + foundation)."
        type: string
        required: false
        default: ""
      node_version:
        description: "Node.js version for the npm license scan."
        type: string
        required: false
        default: "26.4.0"

permissions:
  contents: read

jobs:
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Go license checker
        run: go install github.com/google/go-licenses@latest

      - name: Check Go dependencies for license compliance
        # Allowed: MIT, Apache-2.0, BSD-*, ISC, MPL-2.0, CC0-1.0
        # Forbidden: GPL, AGPL, SSPL (strong copyleft), LGPL, CC-BY-SA
        env:
          SELF_MODULE: github.com/${{ github.repository }}
          EXTRA_IGNORES: ${{ inputs.extra_go_ignores }}
        run: |
          echo "Checking Go dependencies for license compliance..."
          ignores="--ignore=${SELF_MODULE} --ignore=github.com/MustardSeedNetworks/foundation --ignore=modernc.org/mathutil"
          if [ -n "${EXTRA_IGNORES}" ]; then
            IFS=',' read -ra extra <<< "${EXTRA_IGNORES}"
            for m in "${extra[@]}"; do
              m="$(echo "$m" | xargs)" # trim whitespace
              [ -n "$m" ] && ignores="$ignores --ignore=$m"
            done
          fi
          # shellcheck disable=SC2086
          go-licenses check ./... $ignores \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,CC0-1.0 || {
            echo "FAILED: Incompatible licenses found in Go dependencies"
            echo "To see the full report, run: go-licenses report ./..."
            exit 1
          }
          echo "All Go dependencies use compatible licenses"

      - name: Generate Go license report
        run: |
          go-licenses report ./... > go-licenses.txt || true
          echo "=== Go License Summary ==="
          awk -F',' '{print $NF}' go-licenses.txt | sort | uniq -c | sort -rn

      - name: Install npm dependencies
        working-directory: ui
        run: npm ci

      - name: Check npm dependencies for license compliance
        working-directory: ui
        run: |
          echo "Checking npm production dependencies for license compliance..."
          npx license-checker --production \
            --excludePrivatePackages \
            --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;MPL-2.0;CC0-1.0;0BSD;BlueOak-1.0.0;Python-2.0;Unlicense;WTFPL;OFL-1.1" \
            --summary || {
            echo "FAILED: Incompatible licenses found in npm dependencies"
            echo "To see the full report, run: cd ui && npx license-checker --production"
            exit 1
          }
          echo "All npm production dependencies use compatible licenses"

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-report
          path: go-licenses.txt
          retention-days: 30
