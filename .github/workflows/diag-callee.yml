name: Diag Callee
on:
  workflow_call:
permissions: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Echo reusable-workflow context values
        env:
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          echo "ctx job_workflow_sha=[${JOB_WORKFLOW_SHA}] len=${#JOB_WORKFLOW_SHA}"
          echo "ctx job_workflow_ref=[${JOB_WORKFLOW_REF}] len=${#JOB_WORKFLOW_REF}"
          echo "ctx workflow_sha=[${WORKFLOW_SHA}] len=${#WORKFLOW_SHA}"

      - name: Decode the OIDC token claims
        run: |
          set -euo pipefail
          echo "token url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ci-conformance" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$jwt" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ('job_workflow_ref', 'job_workflow_sha', 'workflow_ref', 'workflow_sha', 'repository'):
              print(f"oidc {k}=[{claims.get(k, '<ABSENT>')}]")
          PY
