# Fleet-shared Playwright end-to-end jobs, modeled on seed's ci.yml.
#
# Two browsers, sharded, inside Playwright's own image so the job never calls
# apt. The image ships chromium and webkit and their OS libraries. A cgo
# daemon cannot be built in that image (no toolchain, and its apt sources are
# not reachable), so the optional daemon job builds it on ubuntu-24.04 — the
# image's Ubuntu release, because a newer glibc will not start in the
# container — and the shards download the artifact.
#
# The image tag and the installed @playwright/test must match. The check reads
# the image input, not a copy of the version written beside it: a hardcoded
# copy is invisible to Renovate and fails on a false mismatch (msn-plans G-14).
#
# Draft PRs skip the suite. `!cancelled()` is what lets the jobs still run when
# an upstream result input is `skipped`; `always()` would also run them after
# the workflow was cancelled and then upload a red shard.
#
# Check names are `<caller job id> / E2E Browser Tests (chromium 1/2)` and
# `<caller job id> / E2E Smoke`. Branch protection should require the
# aggregator's check, not each shard: a reshard would otherwise retarget every
# required context.
#
# apt-install and flake-budget are pinned to this repository by SHA. A relative
# `uses: ./` inside a called workflow is resolved in the caller, so a product
# repo would otherwise have to vendor both actions (stem#1792).
#
#   e2e:
#     needs: [backend, frontend]
#     if: ${{ !cancelled() }}
#     permissions:
#       contents: read
#       actions: write
#     uses: MustardSeedNetworks/.github/.github/workflows/ci-e2e.yml@<sha> # pin to a commit (Renovate bumps it)
#     with:
#       backend-result: ${{ needs.backend.result }}
#       frontend-result: ${{ needs.frontend.result }}
#       ui-artifact: frontend-dist
#       build-daemon: true
#       static-libpcap: true
#       require-static-libpcap: true
#       daemon-binary: seed
#       daemon-artifact: seed-e2e-daemon
#       daemon-build-command: ./scripts/build-backend-e2e.sh
name: CI E2E (reusable)

on:
  workflow_call:
    inputs:
      enabled:
        description: When false, every job in this workflow is skipped.
        type: boolean
        required: false
        default: true
      skip-drafts:
        description: Skip the suite on a draft pull request.
        type: boolean
        required: false
        default: true
      backend-result:
        description: >-
          needs.<backend>.result from the caller. Empty does not gate. `failure`
          skips the suite; `success` and `skipped` allow it.
        type: string
        required: false
        default: ""
      frontend-result:
        description: needs.<frontend>.result from the caller. Same values as backend-result.
        type: string
        required: false
        default: ""
      playwright-image:
        description: >-
          Playwright container image, tag and digest. Must match the
          @playwright/test the repo installs.
        type: string
        required: false
        default: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      playwright-container-options:
        description: Options passed to the job container. `--ipc=host` keeps Chromium from exhausting /dev/shm.
        type: string
        required: false
        default: --ipc=host
      browsers:
        description: JSON array of Playwright project names.
        type: string
        required: false
        default: '["chromium", "webkit"]'
      shards:
        description: JSON array of shard indexes. Length should equal shard-count.
        type: string
        required: false
        default: "[1, 2]"
      shard-count:
        description: Denominator passed to Playwright's `--shard`. Must match the length of shards.
        type: string
        required: false
        default: "2"
      ui-dir:
        description: Directory Playwright and npm ci run in.
        type: string
        required: false
        default: ui
      node-version-file:
        description: File setup-node reads the Node version from.
        type: string
        required: false
        default: .nvmrc
      npm-version:
        description: npm installed globally after setup-node. The fleet pin.
        type: string
        required: false
        default: "12.2.1"
      ui-artifact:
        description: Built UI artifact to download. Empty skips the download.
        type: string
        required: false
        default: ""
      ui-artifact-path:
        description: Directory the UI artifact is extracted into.
        type: string
        required: false
        default: internal/api/ui
      fetch-depth:
        description: Checkout depth. Stem needs 0 so `git describe` can see tags.
        type: number
        required: false
        default: 1
      build-daemon:
        description: Build the daemon on ubuntu-24.04 and upload it for the shards.
        type: boolean
        required: false
        default: false
      go-version-file:
        description: File setup-go reads the toolchain from, in the daemon job.
        type: string
        required: false
        default: go.mod
      daemon-runner:
        description: >-
          Runner for the daemon build. ubuntu-24.04 matches the noble
          Playwright image's glibc.
        type: string
        required: false
        default: ubuntu-24.04
      static-libpcap:
        description: >-
          Build a static libpcap and export CGO_CFLAGS/CGO_LDFLAGS for the
          daemon build. The Playwright image has no libpcap.
        type: boolean
        required: false
        default: false
      static-libpcap-command:
        description: Command that builds the static libpcap into $RUNNER_TEMP/libpcap-static.
        type: string
        required: false
        default: ./scripts/build-static-libpcap.sh "$RUNNER_TEMP/libpcap-static"
      require-static-libpcap:
        description: Fail the daemon job when `ldd` still shows libpcap.
        type: boolean
        required: false
        default: false
      daemon-build-command:
        description: Command that produces the daemon binary. Required when build-daemon is true.
        type: string
        required: false
        default: ./scripts/build-backend-e2e.sh
      daemon-binary:
        description: Path of the daemon binary, relative to the repo root. Required when build-daemon is true.
        type: string
        required: false
        default: ""
      daemon-artifact:
        description: Artifact name for the daemon. Required when build-daemon is true. Empty skips the download.
        type: string
        required: false
        default: ""
      prepare-command:
        description: >-
          Command run in the shard and smoke jobs after the downloads and
          before the tests. Empty skips it. A repo that starts its own server
          does that here; $BROWSER, $SHARD and $SHARD_COUNT are set.
        type: string
        required: false
        default: ""
      test-command:
        description: >-
          Sharded Playwright command. `$BROWSER`, `$SHARD` and `$SHARD_COUNT`
          are set. Do not pass `--reporter`: it replaces the config's reporter
          array, and the config is what writes the JSON the flake budget reads.
        type: string
        required: false
        default: ./scripts/run-e2e.sh --project=$BROWSER --grep-invert @smoke --shard=$SHARD/$SHARD_COUNT
      run-smoke:
        description: Run the @smoke job beside the shards.
        type: boolean
        required: false
        default: true
      smoke-command:
        description: Smoke Playwright command. Do not pass `--reporter`.
        type: string
        required: false
        default: ./scripts/run-e2e.sh --grep @smoke
      report-path:
        description: Directory uploaded as the Playwright report.
        type: string
        required: false
        default: ui/playwright-report
      flake-report:
        description: Playwright JSON report the flake budget reads.
        type: string
        required: false
        default: ui/playwright-report/results.json
      flake-budget:
        description: Maximum number of tests allowed to pass only on retry.
        type: string
        required: false
        default: "0"
      server-log:
        description: Server log uploaded after the run.
        type: string
        required: false
        default: server.log
      timeout-minutes:
        description: Per-job timeout for the browser jobs.
        type: number
        required: false
        default: 25

permissions: {}

jobs:
  daemon:
    name: E2E Daemon
    runs-on: ${{ inputs.daemon-runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    if: >-
      ${{ inputs.enabled && inputs.build-daemon && !cancelled() &&
          (inputs.skip-drafts == false || github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          (inputs.backend-result == '' || inputs.backend-result == 'success' || inputs.backend-result == 'skipped') &&
          (inputs.frontend-result == '' || inputs.frontend-result == 'success' || inputs.frontend-result == 'skipped') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Require the daemon artifact inputs
        env:
          DAEMON_BINARY: ${{ inputs.daemon-binary }}
          DAEMON_ARTIFACT: ${{ inputs.daemon-artifact }}
          BUILD_COMMAND: ${{ inputs.daemon-build-command }}
        run: |
          set -euo pipefail
          if [ -z "$DAEMON_BINARY" ] || [ -z "$DAEMON_ARTIFACT" ] || [ -z "$BUILD_COMMAND" ]; then
            echo "::error::build-daemon requires daemon-binary, daemon-artifact, and daemon-build-command"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Download built UI assets
        if: ${{ inputs.ui-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.ui-artifact }}
          path: ${{ inputs.ui-artifact-path }}

      - name: Install libpcap build tools
        if: ${{ inputs.static-libpcap }}
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@0bc6492eca8eee28f85af11187fd54b28bd85fe0 # 0bc6492
        timeout-minutes: 10
        with:
          packages: flex bison

      - name: Build a static libpcap
        if: ${{ inputs.static-libpcap }}
        timeout-minutes: 10
        env:
          LIBPCAP_COMMAND: ${{ inputs.static-libpcap-command }}
        run: sh -euc "$LIBPCAP_COMMAND"

      - name: Build the E2E daemon
        env:
          BUILD_COMMAND: ${{ inputs.daemon-build-command }}
          STATIC_LIBPCAP: ${{ inputs.static-libpcap }}
        run: |
          set -euo pipefail
          if [ "$STATIC_LIBPCAP" = "true" ]; then
            export CGO_CFLAGS="-I${RUNNER_TEMP}/libpcap-static/include${CGO_CFLAGS:+ $CGO_CFLAGS}"
            export CGO_LDFLAGS="-L${RUNNER_TEMP}/libpcap-static/lib${CGO_LDFLAGS:+ $CGO_LDFLAGS}"
          fi
          sh -euc "$BUILD_COMMAND"

      - name: Require a statically linked libpcap
        if: ${{ inputs.require-static-libpcap }}
        env:
          DAEMON_BINARY: ${{ inputs.daemon-binary }}
        run: |
          set -euo pipefail
          if ldd "$DAEMON_BINARY" | grep libpcap; then
            echo "::error::the E2E daemon links libpcap dynamically; the Playwright image has none"
            exit 1
          fi

      - name: Upload the E2E daemon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.daemon-artifact }}
          path: ${{ inputs.daemon-binary }}
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E Browser Tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ inputs.shard-count }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    needs: daemon
    permissions:
      contents: read
      actions: write
    container:
      # The digest is the playwright-image input's default. Callers override
      # it with their own tag and digest; zizmor cannot see a default through
      # an expression, so the ignore sits on the image line itself.
      image: ${{ inputs.playwright-image }} # zizmor: ignore[unpinned-images] digest is the playwright-image input default
      options: ${{ inputs.playwright-container-options }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
        shard: ${{ fromJSON(inputs.shards) }}
    # Skipped when the daemon failed. A skipped daemon (build-daemon false, or
    # a draft) still reaches this if, and the draft check below keeps the
    # shards off a draft. !cancelled() is true for a failed or skipped need;
    # it is false when the run itself was cancelled.
    if: >-
      ${{ inputs.enabled && !cancelled() &&
          (needs.daemon.result == 'success' || needs.daemon.result == 'skipped') &&
          (inputs.skip-drafts == false || github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          (inputs.backend-result == '' || inputs.backend-result == 'success' || inputs.backend-result == 'skipped') &&
          (inputs.frontend-result == '' || inputs.frontend-result == 'success' || inputs.frontend-result == 'skipped') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      # The container runs as root while the checkout is owned by another uid,
      # so git refuses the repo as dubious ownership and `go build` fails.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      - name: Install npm
        working-directory: ${{ inputs.ui-dir }}
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Download built UI assets
        if: ${{ inputs.ui-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.ui-artifact }}
          path: ${{ inputs.ui-artifact-path }}

      - name: Install frontend dependencies (for Playwright)
        working-directory: ${{ inputs.ui-dir }}
        run: npm ci

      - name: Assert Playwright matches the container image
        working-directory: ${{ inputs.ui-dir }}
        env:
          PLAYWRIGHT_IMAGE: ${{ inputs.playwright-image }}
        run: |
          set -euo pipefail
          want=$(printf '%s\n' "$PLAYWRIGHT_IMAGE" | sed -nE 's|.*playwright:v([0-9]+\.[0-9]+\.[0-9]+).*|\1|p' | head -1)
          if [ -z "$want" ]; then
            echo "::error::playwright-image has no vX.Y.Z tag: ${PLAYWRIGHT_IMAGE}"
            exit 1
          fi
          got=$(npx playwright --version | awk '{print $NF}')
          if [ "$got" != "$want" ]; then
            echo "::error::Playwright ${got} does not match the container image (${want}) — bump playwright-image together with @playwright/test"
            exit 1
          fi
          echo "Playwright ${got} matches the image"

      - name: Download the E2E daemon
        if: ${{ inputs.daemon-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.daemon-artifact }}
          path: .

      # upload-artifact drops the executable bit.
      - name: Restore the daemon's executable bit
        if: ${{ inputs.daemon-binary != '' }}
        env:
          DAEMON_BINARY: ${{ inputs.daemon-binary }}
        run: chmod +x "$DAEMON_BINARY"

      - name: Prepare the suite
        if: ${{ inputs.prepare-command != '' }}
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard-count }}
        run: sh -euc "$PREPARE_COMMAND"

      - name: Run Playwright E2E tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard-count }}
          E2E_SKIP_BUILD: "1"
          E2E_SERVER_LOG: ${{ inputs.server-log }}
        run: sh -euc "$TEST_COMMAND"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: ${{ inputs.report-path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce flake budget
        if: ${{ !cancelled() }}
        uses: MustardSeedNetworks/.github/.github/actions/flake-budget@0bc6492eca8eee28f85af11187fd54b28bd85fe0 # 0bc6492
        with:
          report: ${{ inputs.flake-report }}
          budget: ${{ inputs.flake-budget }}

      - name: Upload server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: ${{ inputs.server-log }}
          retention-days: 7
          if-no-files-found: warn

  smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    needs: daemon
    permissions:
      contents: read
      actions: write
    container:
      image: ${{ inputs.playwright-image }} # zizmor: ignore[unpinned-images] digest is the playwright-image input default
      options: ${{ inputs.playwright-container-options }}
    if: >-
      ${{ inputs.enabled && inputs.run-smoke && !cancelled() &&
          (needs.daemon.result == 'success' || needs.daemon.result == 'skipped') &&
          (inputs.skip-drafts == false || github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          (inputs.backend-result == '' || inputs.backend-result == 'success' || inputs.backend-result == 'skipped') &&
          (inputs.frontend-result == '' || inputs.frontend-result == 'success' || inputs.frontend-result == 'skipped') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      - name: Install npm
        working-directory: ${{ inputs.ui-dir }}
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Download built UI assets
        if: ${{ inputs.ui-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.ui-artifact }}
          path: ${{ inputs.ui-artifact-path }}

      - name: Install frontend dependencies (for Playwright)
        working-directory: ${{ inputs.ui-dir }}
        run: npm ci

      - name: Assert Playwright matches the container image
        working-directory: ${{ inputs.ui-dir }}
        env:
          PLAYWRIGHT_IMAGE: ${{ inputs.playwright-image }}
        run: |
          set -euo pipefail
          want=$(printf '%s\n' "$PLAYWRIGHT_IMAGE" | sed -nE 's|.*playwright:v([0-9]+\.[0-9]+\.[0-9]+).*|\1|p' | head -1)
          if [ -z "$want" ]; then
            echo "::error::playwright-image has no vX.Y.Z tag: ${PLAYWRIGHT_IMAGE}"
            exit 1
          fi
          got=$(npx playwright --version | awk '{print $NF}')
          if [ "$got" != "$want" ]; then
            echo "::error::Playwright ${got} does not match the container image (${want}) — bump playwright-image together with @playwright/test"
            exit 1
          fi
          echo "Playwright ${got} matches the image"

      - name: Download the E2E daemon
        if: ${{ inputs.daemon-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.daemon-artifact }}
          path: .

      - name: Restore the daemon's executable bit
        if: ${{ inputs.daemon-binary != '' }}
        env:
          DAEMON_BINARY: ${{ inputs.daemon-binary }}
        run: chmod +x "$DAEMON_BINARY"

      - name: Prepare the suite
        if: ${{ inputs.prepare-command != '' }}
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
          SHARD_COUNT: ${{ inputs.shard-count }}
        run: sh -euc "$PREPARE_COMMAND"

      - name: Run Playwright @smoke tests
        env:
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
          E2E_SKIP_BUILD: "1"
          E2E_SERVER_LOG: ${{ inputs.server-log }}
        run: sh -euc "$SMOKE_COMMAND"

      - name: Upload Playwright smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-smoke-report
          path: ${{ inputs.report-path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce flake budget
        if: ${{ !cancelled() }}
        uses: MustardSeedNetworks/.github/.github/actions/flake-budget@0bc6492eca8eee28f85af11187fd54b28bd85fe0 # 0bc6492
        with:
          report: ${{ inputs.flake-report }}
          budget: ${{ inputs.flake-budget }}

      - name: Upload smoke server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-server-logs
          path: ${{ inputs.server-log }}
          retention-days: 7
          if-no-files-found: warn
