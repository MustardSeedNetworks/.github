# Fleet-shared Go backend jobs, modeled on seed's ci.yml: Linux, macOS, and
# Windows, plus golangci-lint of the Windows tree on Linux.
#
# Product gates (schema drift, route policy, the rest) are not in here. They
# differ per repo and belong in `extra-command`, which runs at the repo root
# after vet and before the test command. The structure that every repo had
# copied — checkout, Go from go.mod, optional libpcap, optional UI artifact,
# golangci-lint, vet, the native jobs off pull_request — lives here once.
#
# Go comes from `go-version-file` (default go.mod) via the pinned setup-go
# action, not from a version literal. Node, when a job asks for it, comes from
# `node-version-file` (default .nvmrc). setup-go's built-in cache stays off:
# the product composites turned it off because a PR-scoped cache evicts main.
#
# macOS and Windows stay off pull_request by default, as they do in seed. They
# still run in the merge queue, on main, and on dispatch. `skip-native-on-pull-request`
# turns that off for a repo that wants them on the PR.
#
# One caller job waits for every job in this workflow. A skipped native job
# does not fail the caller. Name the caller `backend` and put that one job in
# ci-complete's needs.
#
# apt-install is pinned to this repository by SHA. A relative `uses: ./` inside
# a called workflow is resolved in the caller, so a product repo would otherwise
# have to vendor the action (stem#1792).
#
#   backend:
#     needs: changes
#     if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
#     permissions:
#       contents: read
#     uses: MustardSeedNetworks/.github/.github/workflows/ci-backend.yml@<sha> # pin to a commit (Renovate bumps it)
#     with:
#       install-libpcap: true
#       setup-node: true
#       ui-artifact: frontend-dist
#       ui-install: true
#       windows-vet-command: GOOS=windows CGO_ENABLED=0 go vet ./internal/api/...
#       windows-test-command: go test ./internal/api/ -run 'IsAddrInUse|BindWithFallback' -v
#       darwin-test-command: go test -race ./internal/wifi/...
#       extra-command: ./scripts/check-package-reachability.sh
#       tidy-command: |
#         go mod tidy
#         git diff --exit-code go.mod go.sum
name: CI Backend (reusable)

on:
  workflow_call:
    inputs:
      enabled:
        description: When false, every job in this workflow is skipped.
        type: boolean
        required: false
        default: true
      go-version-file:
        description: File setup-go reads the toolchain from.
        type: string
        required: false
        default: go.mod
      node-version-file:
        description: File setup-node reads the Node version from, when setup-node is true.
        type: string
        required: false
        default: .nvmrc
      npm-version:
        description: npm installed globally after setup-node. The fleet pin.
        type: string
        required: false
        default: "12.2.1"
      install-libpcap:
        description: Install libpcap-dev on the Linux job before building.
        type: boolean
        required: false
        default: true
      setup-node:
        description: Install Node on the Linux job. Seed's backend typechecks generated TS.
        type: boolean
        required: false
        default: false
      ui-artifact:
        description: Artifact name of the built UI to download. Empty skips the download.
        type: string
        required: false
        default: ""
      ui-artifact-path:
        description: Directory the UI artifact is extracted into.
        type: string
        required: false
        default: internal/api/ui
      ui-dir:
        description: Directory `npm ci` runs in when ui-install is true.
        type: string
        required: false
        default: ui
      ui-install:
        description: Run npm ci in ui-dir on the Linux job.
        type: boolean
        required: false
        default: false
      golangci-lint-version:
        description: golangci-lint version passed to golangci-lint-action.
        type: string
        required: false
        default: v2.15.0
      golangci-lint-args:
        description: Extra arguments for the Linux golangci-lint run.
        type: string
        required: false
        default: --timeout=5m
      lint-windows:
        description: Lint the tree again with GOOS=windows on Linux.
        type: boolean
        required: false
        default: true
      skip-native-on-pull-request:
        description: >-
          Skip the macOS and Windows jobs on pull_request. They still run on
          merge_group, push, and workflow_dispatch.
        type: boolean
        required: false
        default: true
      cgo-enabled-windows:
        description: CGO_ENABLED for the Windows job. Seed sets 0; the runner has no Npcap.
        type: string
        required: false
        default: "0"
      fetch-depth:
        description: Fetch depth for the Linux and Windows checkouts.
        type: number
        required: false
        default: 1
      native-fetch-depth:
        description: Fetch depth for the macOS checkout. 0 is the full history.
        type: number
        required: false
        default: 0
      timeout-minutes:
        description: Per-job timeout for the build-and-test jobs.
        type: number
        required: false
        default: 20
      pre-command:
        description: >-
          Command run at the repo root after setup and before lint. Empty skips
          it. Stem builds its native dataplane here.
        type: string
        required: false
        default: ""
      build-command:
        description: Linux compile command. Empty skips it; `go test` compiles.
        type: string
        required: false
        default: ""
      vet-command:
        description: Linux `go vet` command.
        type: string
        required: false
        default: go vet ./...
      windows-vet-command:
        description: Extra vet command on Linux, typically a GOOS=windows cross-vet. Empty skips it.
        type: string
        required: false
        default: ""
      extra-command:
        description: Product gates, run at the repo root after vet and before tests. Empty skips them.
        type: string
        required: false
        default: ""
      test-command:
        description: Linux test command.
        type: string
        required: false
        default: go test ./...
      coverage-command:
        description: Coverage gate run after tests. Empty skips it.
        type: string
        required: false
        default: ""
      tidy-command:
        description: go.mod tidy check. Empty skips it.
        type: string
        required: false
        default: ""
      darwin-build-command:
        description: macOS compile command.
        type: string
        required: false
        default: go build ./...
      darwin-vet-command:
        description: macOS vet command.
        type: string
        required: false
        default: go vet ./...
      darwin-test-command:
        description: macOS test command.
        type: string
        required: false
        default: go test ./...
      windows-build-command:
        description: Windows compile command.
        type: string
        required: false
        default: go build ./...
      windows-vet-only-command:
        description: Windows vet command, run on the Windows runner.
        type: string
        required: false
        default: go vet ./...
      windows-test-command:
        description: Windows test command. Narrow this when the tree needs Npcap.
        type: string
        required: false
        default: go test ./...

permissions: {}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ inputs.enabled }}
    permissions:
      contents: read
      # Downloading the UI artifact. Absent when ui-artifact is empty; the
      # token is still read-only for actions.
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Install libpcap-dev
        if: ${{ inputs.install-libpcap }}
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@0bc6492eca8eee28f85af11187fd54b28bd85fe0 # 0bc6492
        timeout-minutes: 10
        with:
          packages: libpcap-dev

      - name: Set up Node.js
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      - name: Install npm
        if: ${{ inputs.setup-node }}
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Download built UI assets
        if: ${{ inputs.ui-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.ui-artifact }}
          path: ${{ inputs.ui-artifact-path }}

      - name: Install UI dependencies
        if: ${{ inputs.ui-install }}
        working-directory: ${{ inputs.ui-dir }}
        run: npm ci

      - name: Pre-test setup
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
        run: sh -euc "$PRE_COMMAND"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: ${{ inputs.golangci-lint-args }}
          # The action's cache key carries no GOOS, so this job and the
          # Windows lint job would share one entry while analysing two trees.
          # Seed #2511.
          skip-cache: true

      - name: Run go vet
        env:
          VET_COMMAND: ${{ inputs.vet-command }}
        run: sh -euc "$VET_COMMAND"

      - name: Run the extra vet command
        if: ${{ inputs.windows-vet-command != '' }}
        env:
          VET_COMMAND: ${{ inputs.windows-vet-command }}
        run: sh -euc "$VET_COMMAND"

      - name: Product gates
        if: ${{ inputs.extra-command != '' }}
        env:
          EXTRA_COMMAND: ${{ inputs.extra-command }}
        run: sh -euc "$EXTRA_COMMAND"

      - name: Build
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: sh -euc "$BUILD_COMMAND"

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: sh -euc "$TEST_COMMAND"

      - name: Check coverage
        if: ${{ inputs.coverage-command != '' }}
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
        run: sh -euc "$COVERAGE_COMMAND"

      - name: Check go mod tidy
        if: ${{ inputs.tidy-command != '' }}
        env:
          TIDY_COMMAND: ${{ inputs.tidy-command }}
        run: sh -euc "$TIDY_COMMAND"

  backend-darwin:
    name: Backend (macOS)
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Off pull_request unless the caller opts in. The merge queue and main
    # still run it, which is where a darwin-only break has to fail.
    if: >-
      ${{ inputs.enabled &&
          (inputs.skip-native-on-pull-request == false || github.event_name != 'pull_request') }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.native-fetch-depth }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      # No libpcap step: macOS ships it.
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.darwin-build-command }}
        run: sh -euc "$BUILD_COMMAND"

      - name: Vet
        env:
          VET_COMMAND: ${{ inputs.darwin-vet-command }}
        run: sh -euc "$VET_COMMAND"

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.darwin-test-command }}
        run: sh -euc "$TEST_COMMAND"

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      ${{ inputs.enabled &&
          (inputs.skip-native-on-pull-request == false || github.event_name != 'pull_request') }}
    permissions:
      contents: read
    env:
      CGO_ENABLED: ${{ inputs.cgo-enabled-windows }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.windows-build-command }}
        run: sh -euc "$BUILD_COMMAND"

      - name: Vet
        env:
          VET_COMMAND: ${{ inputs.windows-vet-only-command }}
        run: sh -euc "$VET_COMMAND"

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.windows-test-command }}
        run: sh -euc "$TEST_COMMAND"

  lint-windows:
    name: Lint (GOOS=windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.enabled && inputs.lint-windows }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Run golangci-lint for GOOS=windows
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: ${{ inputs.golangci-lint-version }}
          skip-cache: true
