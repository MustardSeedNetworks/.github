# Fleet-shared reusable Semgrep SAST gate for seed / stem / niac.
# Each repo's ci.yml calls it as a job so the ci-complete aggregator can
# `needs: [semgrep]` exactly as before:
#
#   semgrep:
#     uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@<sha> # pin to a tag SHA (Renovate bumps it)
#
# The three repos ran byte-identical Semgrep jobs; this is the one edit-point
# for the pinned version and the config/severity policy.
name: Semgrep SAST (reusable)

on:
  workflow_call:

# Callers must grant security-events: write as well as contents: read — the
# all-severity SARIF is published to the code-scanning tab. A caller that
# grants only contents: read will fail at the upload step on pull_request and
# push, deliberately: a silently-skipped upload is how a security feed goes
# stale unnoticed. merge_group skips the upload only (see that step); the
# scan and the ERROR gate still run, and a called workflow sees the caller's
# github.event_name, so this does not require a new input.
permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      - name: Install Semgrep (pinned)
        run: pip install "semgrep==1.168.0"

      # One scan, two consumers. Visibility and gating are different questions:
      # the old job ran with --severity ERROR, so WARNING/MEDIUM findings were
      # never reported anywhere at all — contradicting the repos' own docs,
      # which say they stay visible. Scanning once at every severity and
      # deciding from the SARIF gives both without paying for a second scan.
      - name: Run Semgrep (all severities, SARIF)
        run: |
          semgrep scan \
            --config p/golang \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep-results.sarif \
            --metrics=off

      # Not continue-on-error. On pull_request and push this is the visibility
      # half of the gate, and an upload that fails has to fail the job: a
      # swallowed error is how the code-scanning feed goes stale unnoticed.
      #
      # merge_group is the one event that skips it. GitHub deletes
      # refs/heads/gh-readonly-queue/... before upload-sarif posts, and the
      # code-scanning API then rejects the call with "ref ... not found".
      # That fails this job, CI Complete goes red, and the PR is dropped from
      # the queue. The pull_request run already published the SARIF for the
      # same commits. success() keeps a failed scan from attempting the
      # upload; the finding gate below still runs whenever the scan did.
      - name: Upload Semgrep results
        if: ${{ success() && github.event_name != 'merge_group' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # The blocking decision, read from the SARIF file the scan wrote. It
      # does not read the code-scanning API, so a merge_group run that skipped
      # the upload still fails closed on ERROR. Semgrep's ERROR severity maps
      # to SARIF level "error".
      - name: Fail on ERROR-severity findings
        run: |
          cat > /tmp/count-errors.py <<'PYEOF'
          import json, sys

          with open("semgrep-results.sarif") as fh:
              sarif = json.load(fh)

          errors = []
          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              rules = {r.get("id"): r for r in driver.get("rules", [])}
              for res in run.get("results", []):
                  # A result may carry its own level; otherwise it inherits the
                  # rule's default configuration.
                  level = res.get("level")
                  if level is None:
                      rule = rules.get(res.get("ruleId"), {})
                      level = rule.get("defaultConfiguration", {}).get("level")
                  if level == "error":
                      loc = ""
                      locs = res.get("locations") or []
                      if locs:
                          phys = locs[0].get("physicalLocation", {})
                          uri = phys.get("artifactLocation", {}).get("uri", "")
                          line = phys.get("region", {}).get("startLine", "")
                          loc = f"{uri}:{line}: "
                      errors.append(f"{loc}{res.get('ruleId')}: "
                                    f"{res.get('message', {}).get('text', '')}")

          for e in errors:
              print(e, file=sys.stderr)
          print(len(errors))
          PYEOF
          count=$(python3 /tmp/count-errors.py)
          echo "Semgrep ERROR-severity findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::Semgrep found $count ERROR-severity finding(s)"
            exit 1
          fi
