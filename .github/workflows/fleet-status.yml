# Fleet STATUS.md from GitHub alone: plans, open PRs, CI on main, releases,
# and the CI load (failed runs per day, CI share of the week's finished rows).
#
# One dispatch writes the page (job summary + `fleet-status` artifact). The
# driver host's daily digest (driver-host-migration D8) runs the script itself
# with its host-only inputs added — the watchdog state and the working trees
# on disk — which a GitHub runner cannot see; here those two sections say
# "Not collected" rather than reading as empty.
#
# TOKEN: the msn-ci-bot App, scoped to the repositories below, read-only.
# msn-plans is private, so its checkout needs the App; the installation holds
# no `actions` or `checks` permission, so "CI on main" for a private repo
# reads "unreadable" in its cell. Requesting a permission the installation
# lacks fails the mint outright (see ci-conformance-schedule.yml), so the fix
# for that is an owner grant on the App, not a line here.

name: Fleet status

on:
  workflow_dispatch:

permissions: {}

jobs:
  status:
    name: Fleet status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out this repo (script source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: dotgithub

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: MustardSeedNetworks
          # Keep in step with DEFAULT_REPOS in scripts/fleet-status.py, plus
          # msn-plans for the checkout.
          repositories: >-
            msn-plans,seed,stem,niac-go,trellis,foundation,.github,
            msn-docs-internal,msn-internal-tools,niac-demo-catalog,
            mustardseednetworks-com,niac-java
          permission-contents: read
          permission-pull-requests: read

      - name: Check out msn-plans
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MustardSeedNetworks/msn-plans
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: plans
          # The CI load section diffs the plans against their state a week
          # ago, so it needs the history, not just the tip.
          fetch-depth: 0

      - name: Write STATUS.md
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 dotgithub/scripts/fleet-status.py --plans plans --output STATUS.md
          cat STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload STATUS.md
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-status
          path: STATUS.md
