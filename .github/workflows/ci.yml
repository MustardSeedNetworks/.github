# Self-CI for the policy repository.
#
# This repo holds the fleet's Renovate preset, the reusable Semgrep, CodeQL-gate
# and dependency-review workflows, and the conformance script every product
# repo's CI calls. A mistake here breaks four repositories at once — and until
# now nothing checked it: no workflow ran on a pull request, so the twelve
# Python tests under scripts/i18n/ had never been executed by CI, and a typo in
# default.json would have reached Renovate before anyone noticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Policy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # These test files exist in the tree and have never been run by CI.
      - name: Run the i18n script tests
        run: |
          set -euo pipefail
          python3 scripts/i18n/test-check-keys.py
          python3 scripts/i18n/test-es-fill.py

      # The conformance script gates every product repo, so a rule that
      # silently stops firing weakens all four at once. These fixtures assert
      # each build-contract rule still fails a violating ci.yml.
      - name: Run the CI conformance tests
        run: python3 scripts/test-check-ci-conformance.py

      # A syntax error in the conformance script fails every product repo's
      # ci-conformance job, so compiling it here turns that into a local failure.
      - name: Compile every policy script
        run: python3 -m compileall -q scripts/

  renovate-config:
    name: Renovate preset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-node composite in this repo (it holds apt-install,
      # flake-budget and i18n-validate only), so pin the action directly at the
      # fleet's Node version rather than taking whatever the runner ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"

      # default.json is the fleet's dependency policy. Renovate silently
      # ignores a config it cannot parse, so a typo here would not fail
      # anywhere — it would just stop the rules applying, across four repos.
      - name: Validate default.json
        run: npx --yes --package renovate@42.5.2 -- renovate-config-validator default.json

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is the fleet-standard style exclusion.
          #
          # The `job_workflow_sha` ignore that used to sit here is gone with the
          # expression it excused. actionlint was RIGHT: the property is not in
          # the `github` context, it evaluated empty, and the ignore was the
          # only thing standing between that and a visible failure (.github#73).
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.29.0
          zizmor --min-severity high --color always .github/workflows/

  # Nothing ran this repo's own conformance gate: it decides four product
  # repos and was exercised only by unit tests over the script, never end to
  # end. That is how .github#73 reached main — the gate could not have caught
  # its own checkout landing on the wrong commit.
  #
  # The pin below is a literal by necessity (`uses:` takes no expressions) and
  # is the point of the test, not an oversight: it names a commit of this
  # branch, and `conformance-self-test-result` asserts the workflow reports
  # reading its scripts from exactly that commit. If ref resolution regresses
  # to the default branch, the two SHAs diverge and this fails.
  conformance-self-test:
    name: Conformance Self-Test
    permissions:
      contents: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@55d509d09e431c441ec068c031aba538881c5d3c
    with:
      repo-root: test/fixtures/conformant-repo

  conformance-self-test-result:
    name: Conformance Self-Test Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: conformance-self-test
    steps:
      - name: Assert the gate read its scripts from the pinned commit
        env:
          PINNED: "55d509d09e431c441ec068c031aba538881c5d3c"
          RESOLVED: ${{ needs.conformance-self-test.outputs.policy-sha }}
        run: |
          set -euo pipefail
          echo "pinned in uses:   $PINNED"
          echo "policy-sha output: $RESOLVED"
          if [ -z "$RESOLVED" ]; then
            echo "::error::the conformance workflow reported no policy-sha"
            exit 1
          fi
          if [ "$PINNED" != "$RESOLVED" ]; then
            echo "::error::conformance ran .github@$RESOLVED but this job pinned $PINNED"
            exit 1
          fi
          echo "The pinned ref was honoured."

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - python
      - renovate-config
      - workflow-lint
      - conformance-self-test
      - conformance-self-test-result
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
