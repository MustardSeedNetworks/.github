name: 'apt install (bounded)'
description: >-
  Install apt packages with bounded network waits and a retry, so a stalled
  Ubuntu mirror fails fast instead of consuming the whole job budget.
inputs:
  packages:
    description: 'Space-separated package list, e.g. "libpcap-dev cppcheck".'
    required: true
  attempts:
    description: 'How many times to try before failing.'
    required: false
    default: '2'
  retry-delay-seconds:
    description: >-
      Base seconds to wait between attempts; the wait is this multiplied by the
      attempt number. The default of 10 covers a transient error. Raise it on
      the release path, where the thing being waited out is a mirror OUTAGE
      lasting minutes rather than a single bad response — two attempts ten
      seconds apart cannot span one, and a failed release is expensive.
    required: false
    default: '10'
  command-timeout:
    description: >-
      Seconds any single apt invocation may run before it is killed. Raise for
      large package sets (Playwright''s webkit stack pulls ~180 packages).
    required: false
    default: '270'
  update:
    description: "Run apt-get update first. Set 'false' when a prior step already did."
    required: false
    default: 'true'
  max-command-timeout:
    description: >-
      Upper bound, in seconds, for the `apt-get install` invocation when the
      download is large. The install timeout is sized from the measured
      download (`apt-get --print-uris`): `size / min-download-kbps` plus a
      minute, never below `command-timeout` and never above this. Empty keeps
      the old behaviour (every invocation gets exactly `command-timeout`).
      The caller's step `timeout-minutes` must cover attempts x (update +
      this + 30 s) + the waits between attempts. A fixed 270 s killed
      stem's Dataplane install on 2026-11-23 and 2026-11-26 when the Azure
      mirror ran at about 0.3 MB/s for a 129 MB set.
    required: false
    default: ''
  min-download-kbps:
    description: >-
      The slowest mirror throughput the install is sized to survive, in KB/s.
      Only used with `max-command-timeout`.
    required: false
    default: '400'
  mirror-fallback:
    description: >-
      On Ubuntu, from the second attempt on, point apt at archive.ubuntu.com
      instead of the runner's Azure mirror (azure.archive.ubuntu.com or its
      apt-mirrors.txt list), then update. A mirror that is slow once is often
      slow for the next ten minutes, so retrying the same host repeats the
      failure. 'false' keeps the runner's own mirror throughout.
    required: false
    default: 'true'
  no-install-recommends:
    description: 'Pass --no-install-recommends to apt-get install.'
    required: false
    default: 'false'
  command:
    description: >-
      Run this command under the same timeout/retry/apt-config wrapper instead
      of `apt-get install`. For installers that shell out to apt themselves —
      `npx playwright install-deps` is the case this exists for. When set,
      `packages` and `no-install-recommends` are ignored.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
        CUSTOM_CMD: ${{ inputs.command }}
        ATTEMPTS: ${{ inputs.attempts }}
        RETRY_DELAY: ${{ inputs.retry-delay-seconds }}
        CMD_TIMEOUT: ${{ inputs.command-timeout }}
        DO_UPDATE: ${{ inputs.update }}
        MAX_CMD_TIMEOUT: ${{ inputs.max-command-timeout }}
        MIN_KBPS: ${{ inputs.min-download-kbps }}
        MIRROR_FALLBACK: ${{ inputs.mirror-fallback }}
      # Three distinct failures are bounded here, and they pull in different
      # directions — a fix for one must not re-break the others.
      #
      # STALLED MIRROR: apt blocks forever on a dead connection by default.
      # niac's libpcap-dev install hung 25 minutes (job 95072124340) and stem's
      # Playwright OS-deps hung 28 (job 95068053052) — both cancelled at the job
      # timeout with no test having run. Acquire::*::Timeout bounds that, so a
      # dead mirror still fails in seconds however long the outer timeout is.
      #
      # LOCK CONTENTION: the opposite problem, and the right response is to
      # WAIT, not to retry. Retrying into a held lock cannot succeed. Hence one
      # patient wait (DPkg::Lock::Timeout 240) rather than several short ones,
      # and a default of two attempts — the second is for a transient mirror
      # error, not for the lock.
      #
      # MIRROR OUTAGE: distinct from a stalled connection. The mirror answers,
      # but wrongly, for MINUTES. niac's v0.94.46 release went red this way:
      # both attempts failed 4.5 minutes apart against an unreachable mirror,
      # and a rerun with no code change passed. Bounded waits do not help --
      # each attempt fails fast and correctly -- and neither does a third
      # attempt ten seconds later. What spans it is a longer wait BETWEEN
      # attempts, which is what retry-delay-seconds is for. It is left at 10 by
      # default because on a normal CI job failing fast is worth more than
      # riding out an outage; the release path sets it higher.
      # See MustardSeedNetworks/niac-go#1364.
      #
      # ORPHANED apt-get: the reason the two above were not enough. The lock
      # holder was us. A slow mirror pushes the download past command-timeout,
      # the wrapper is killed, and the root-owned apt-get underneath SURVIVES —
      # so the next attempt blocks on the process the previous attempt leaked.
      # Proven on 2026-08-18 by the orphan's own output interleaving into the
      # next attempt's log, continuing its download sequence (Get:6 -> Get:7 in
      # seed run 32159346838, Get:114 -> Get:115 in niac run 32159744734) while
      # that attempt reported the lock "held by process 7209/6101 (apt-get)".
      # See MustardSeedNetworks/seed#1950. Two things follow:
      #   - sudo goes OUTSIDE timeout. coreutils timeout already signals the
      #     whole process group; what it could not do was signal root-owned
      #     children as an unprivileged user. Running timeout as root fixes the
      #     apt-get path outright.
      #   - the custom-command path cannot do that (npx must not run as root),
      #     so after a failed attempt we look the holder up by name and clear
      #     it before retrying.
      #
      # SLOW MIRROR: distinct again. The mirror answers and the bytes move, but
      # slowly (stem 2026-11-26: llvm-18-dev, 45 MB, still unfinished after
      # 270 s), so a fixed per-invocation timeout kills a download that was
      # progressing and the retry restarts the same slow transfer from the same
      # mirror. Three things address it: callers drop packages they do not
      # need (`no-install-recommends`: clang-18 recommends llvm-18-dev), the
      # install timeout is sized from the measured download when the caller
      # allows it (`max-command-timeout`), and the second attempt moves to
      # archive.ubuntu.com (`mirror-fallback`). The measured size and the
      # achieved rate are logged so a slow mirror shows in the job log.
      #
      # A composite step cannot carry `timeout-minutes`, so callers must keep a
      # step-level timeout as the outer backstop, and it has to cover the
      # worst case below or it pre-empts the second attempt it exists to allow
      # (MustardSeedNetworks/.github#217). With the defaults (command-timeout
      # 270, 15 s timeout -k grace, retry-delay 10, 120 s orphan grace + 5 s
      # TERM->KILL wait):
      #   - `command` path, one attempt is one timeout (285 s); every failed
      #     attempt then runs clear_lock_holder (up to 130 s), because the
      #     orphan survives the wrapper kill. Two attempts:
      #     285 + 130 + 10 + 285 = 710 s, so 13 minutes.
      #   - `packages` path, apt-get update and apt-get install each get a full
      #     timeout (570 s per attempt). sudo sits outside timeout, so orphans
      #     are rare, but the budget still has to hold: 570 + 130 + 10 + 570 =
      #     1280 s, so 22 minutes.
      # In general: attempts x (timeouts per attempt x (command-timeout + 15))
      # + (attempts - 1) x (lock-holder wait 130 + attempt x retry-delay).
      # Raise the caller's step timeout whenever command-timeout, attempts or
      # retry-delay-seconds is raised.
      run: |
        set -uo pipefail

        # Container jobs (goreleaser-cross, niac-content) run as root and have
        # no sudo installed; runner jobs are non-root and need it.
        if [ "$(id -u)" -eq 0 ]; then
          SUDO=""
        else
          SUDO="sudo"
        fi

        $SUDO tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::Retries "2";
        DPkg::Lock::Timeout "240";
        EOF

        # Names whoever still holds the dpkg lock after one of our attempts
        # died, then gets it out of the way. Almost always our own orphan
        # finishing the very install we asked for, so it is given a grace
        # period first — letting it finish leaves the packages installed and
        # the retry cheap. The `ps` line is the diagnostic that makes the next
        # regression self-identifying rather than another unnamed PID.
        clear_lock_holder() {
          if ! command -v fuser >/dev/null 2>&1; then
            echo "fuser unavailable (psmisc not installed); cannot name the lock holder"
            return 0
          fi

          holders="$($SUDO fuser /var/lib/dpkg/lock-frontend 2>/dev/null || true)"
          [ -n "$holders" ] || return 0

          echo "dpkg lock still held after attempt ${attempt}; holder(s):"
          $SUDO ps -o pid,ppid,etimes,cmd -p $holders || true

          waited=0
          while [ "$waited" -lt 120 ] \
            && $SUDO fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            sleep 5
            waited=$((waited + 5))
          done

          holders="$($SUDO fuser /var/lib/dpkg/lock-frontend 2>/dev/null || true)"
          if [ -n "$holders" ]; then
            echo "holder outlasted the ${waited}s grace; clearing it"
            $SUDO kill -TERM $holders 2>/dev/null || true
            sleep 5
            $SUDO kill -KILL $holders 2>/dev/null || true
          fi
        }

        # Bytes the install would download, from apt's own plan.
        plan_bytes() {
          $SUDO apt-get install -y --print-uris $recommends $PACKAGES 2>/dev/null \
            | awk '/^.http/ { s += $(NF - 1) } END { printf "%d", s }'
        }

        # Moves apt from the runner's Azure mirror to archive.ubuntu.com.
        switch_mirror() {
          [ "$MIRROR_FALLBACK" = "true" ] || return 0
          . /etc/os-release 2>/dev/null || true
          [ "${ID:-}" = "ubuntu" ] || return 0
          changed=false
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            if grep -Eq 'azure\.archive\.ubuntu\.com|mirror\+file:/etc/apt/apt-mirrors\.txt' "$f"; then
              $SUDO sed -i -E 's#(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://azure\.archive\.ubuntu\.com/ubuntu/?)#http://archive.ubuntu.com/ubuntu/#g' "$f"
              changed=true
            fi
          done
          if [ "$changed" = "true" ]; then
            echo "apt: switched to archive.ubuntu.com for attempt ${attempt}"
            if [ "$DO_UPDATE" != "true" ]; then
              $SUDO timeout -k 15 "$CMD_TIMEOUT" apt-get update || true
            fi
          fi
        }

        recommends=""
        if [ "$NO_RECOMMENDS" = "true" ]; then
          recommends="--no-install-recommends"
        fi

        attempt=1
        while [ "$attempt" -le "$ATTEMPTS" ]; do
          if [ "$attempt" -gt 1 ]; then
            # A timeout kill can leave dpkg half-configured; recover first.
            $SUDO dpkg --configure -a >/dev/null 2>&1 || true
            switch_mirror
          fi

          ok=true
          if [ "$DO_UPDATE" = "true" ] && [ -z "$CUSTOM_CMD" ]; then
            $SUDO timeout -k 15 "$CMD_TIMEOUT" apt-get update || ok=false
          fi

          if [ "$ok" = "true" ]; then
            if [ -n "$CUSTOM_CMD" ]; then
              # The command drives apt itself; the config drop-in above still
              # bounds its waits.
              if timeout -k 15 "$CMD_TIMEOUT" bash -c "$CUSTOM_CMD"; then
                exit 0
              fi
            else
              install_timeout="$CMD_TIMEOUT"
              bytes="$(plan_bytes)"
              if [ -n "$MAX_CMD_TIMEOUT" ] && [ "${bytes:-0}" -gt 0 ]; then
                need=$((bytes / 1024 / MIN_KBPS + 60))
                if [ "$need" -gt "$install_timeout" ]; then
                  install_timeout=$(( need < MAX_CMD_TIMEOUT ? need : MAX_CMD_TIMEOUT ))
                fi
              fi
              echo "apt: $((${bytes:-0} / 1048576)) MB to download; install timeout ${install_timeout}s"
              started=$SECONDS
              if $SUDO timeout -k 15 "$install_timeout" \
                apt-get install -y $recommends $PACKAGES; then
                took=$((SECONDS - started))
                echo "apt: downloaded and installed in ${took}s ($((${bytes:-0} / 1024 / (took > 0 ? took : 1))) KB/s average)"
                exit 0
              fi
              took=$((SECONDS - started))
              fetched="$($SUDO du -sk /var/cache/apt/archives 2>/dev/null | cut -f1)"
              echo "apt: attempt ${attempt} ran ${took}s; ${fetched:-0} KB in the apt cache so far"
            fi
          fi

          echo "apt install attempt ${attempt}/${ATTEMPTS} failed"
          clear_lock_holder
          if [ "$attempt" -lt "$ATTEMPTS" ]; then
            sleep $((attempt * RETRY_DELAY))
          fi
          attempt=$((attempt + 1))
        done

        echo "::error::apt step failed after ${ATTEMPTS} attempts: ${CUSTOM_CMD:-$PACKAGES}"
        exit 1
