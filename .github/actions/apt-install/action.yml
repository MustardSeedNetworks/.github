name: 'apt install (bounded)'
description: >-
  Install apt packages with bounded network waits and a retry, so a stalled
  Ubuntu mirror fails fast instead of consuming the whole job budget.
inputs:
  packages:
    description: 'Space-separated package list, e.g. "libpcap-dev cppcheck".'
    required: true
  attempts:
    description: 'How many times to try before failing.'
    required: false
    default: '2'
  command-timeout:
    description: >-
      Seconds any single apt invocation may run before it is killed. Raise for
      large package sets (Playwright''s webkit stack pulls ~180 packages).
    required: false
    default: '270'
  update:
    description: "Run apt-get update first. Set 'false' when a prior step already did."
    required: false
    default: 'true'
  no-install-recommends:
    description: 'Pass --no-install-recommends to apt-get install.'
    required: false
    default: 'false'
  command:
    description: >-
      Run this command under the same timeout/retry/apt-config wrapper instead
      of `apt-get install`. For installers that shell out to apt themselves —
      `npx playwright install-deps` is the case this exists for. When set,
      `packages` and `no-install-recommends` are ignored.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
        CUSTOM_CMD: ${{ inputs.command }}
        ATTEMPTS: ${{ inputs.attempts }}
        CMD_TIMEOUT: ${{ inputs.command-timeout }}
        DO_UPDATE: ${{ inputs.update }}
      # Three distinct failures are bounded here, and they pull in different
      # directions — a fix for one must not re-break the others.
      #
      # STALLED MIRROR: apt blocks forever on a dead connection by default.
      # niac's libpcap-dev install hung 25 minutes (job 95072124340) and stem's
      # Playwright OS-deps hung 28 (job 95068053052) — both cancelled at the job
      # timeout with no test having run. Acquire::*::Timeout bounds that, so a
      # dead mirror still fails in seconds however long the outer timeout is.
      #
      # LOCK CONTENTION: the opposite problem, and the right response is to
      # WAIT, not to retry. Retrying into a held lock cannot succeed. Hence one
      # patient wait (DPkg::Lock::Timeout 240) rather than several short ones,
      # and a default of two attempts — the second is for a transient mirror
      # error, not for the lock.
      #
      # ORPHANED apt-get: the reason the two above were not enough. The lock
      # holder was us. A slow mirror pushes the download past command-timeout,
      # the wrapper is killed, and the root-owned apt-get underneath SURVIVES —
      # so the next attempt blocks on the process the previous attempt leaked.
      # Proven on 2026-08-18 by the orphan's own output interleaving into the
      # next attempt's log, continuing its download sequence (Get:6 -> Get:7 in
      # seed run 32159346838, Get:114 -> Get:115 in niac run 32159744734) while
      # that attempt reported the lock "held by process 7209/6101 (apt-get)".
      # See MustardSeedNetworks/seed#1950. Two things follow:
      #   - sudo goes OUTSIDE timeout. coreutils timeout already signals the
      #     whole process group; what it could not do was signal root-owned
      #     children as an unprivileged user. Running timeout as root fixes the
      #     apt-get path outright.
      #   - the custom-command path cannot do that (npx must not run as root),
      #     so after a failed attempt we look the holder up by name and clear
      #     it before retrying.
      #
      # A composite step cannot carry `timeout-minutes`, so callers must keep a
      # step-level timeout as the outer backstop, and it has to exceed
      # attempts x command-timeout or it will pre-empt the lock wait it is
      # meant to protect.
      run: |
        set -uo pipefail

        # Container jobs (goreleaser-cross, niac-content) run as root and have
        # no sudo installed; runner jobs are non-root and need it.
        if [ "$(id -u)" -eq 0 ]; then
          SUDO=""
        else
          SUDO="sudo"
        fi

        $SUDO tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::Retries "2";
        DPkg::Lock::Timeout "240";
        EOF

        # Names whoever still holds the dpkg lock after one of our attempts
        # died, then gets it out of the way. Almost always our own orphan
        # finishing the very install we asked for, so it is given a grace
        # period first — letting it finish leaves the packages installed and
        # the retry cheap. The `ps` line is the diagnostic that makes the next
        # regression self-identifying rather than another unnamed PID.
        clear_lock_holder() {
          if ! command -v fuser >/dev/null 2>&1; then
            echo "fuser unavailable (psmisc not installed); cannot name the lock holder"
            return 0
          fi

          holders="$($SUDO fuser /var/lib/dpkg/lock-frontend 2>/dev/null || true)"
          [ -n "$holders" ] || return 0

          echo "dpkg lock still held after attempt ${attempt}; holder(s):"
          $SUDO ps -o pid,ppid,etimes,cmd -p $holders || true

          waited=0
          while [ "$waited" -lt 120 ] \
            && $SUDO fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            sleep 5
            waited=$((waited + 5))
          done

          holders="$($SUDO fuser /var/lib/dpkg/lock-frontend 2>/dev/null || true)"
          if [ -n "$holders" ]; then
            echo "holder outlasted the ${waited}s grace; clearing it"
            $SUDO kill -TERM $holders 2>/dev/null || true
            sleep 5
            $SUDO kill -KILL $holders 2>/dev/null || true
          fi
        }

        attempt=1
        while [ "$attempt" -le "$ATTEMPTS" ]; do
          if [ "$attempt" -gt 1 ]; then
            # A timeout kill can leave dpkg half-configured; recover first.
            $SUDO dpkg --configure -a >/dev/null 2>&1 || true
          fi

          ok=true
          if [ "$DO_UPDATE" = "true" ] && [ -z "$CUSTOM_CMD" ]; then
            $SUDO timeout -k 15 "$CMD_TIMEOUT" apt-get update || ok=false
          fi

          if [ "$ok" = "true" ]; then
            if [ -n "$CUSTOM_CMD" ]; then
              # The command drives apt itself; the config drop-in above still
              # bounds its waits.
              if timeout -k 15 "$CMD_TIMEOUT" bash -c "$CUSTOM_CMD"; then
                exit 0
              fi
            else
              recommends=""
              if [ "$NO_RECOMMENDS" = "true" ]; then
                recommends="--no-install-recommends"
              fi
              if $SUDO timeout -k 15 "$CMD_TIMEOUT" \
                apt-get install -y $recommends $PACKAGES; then
                exit 0
              fi
            fi
          fi

          echo "apt install attempt ${attempt}/${ATTEMPTS} failed"
          clear_lock_holder
          if [ "$attempt" -lt "$ATTEMPTS" ]; then
            sleep $((attempt * 10))
          fi
          attempt=$((attempt + 1))
        done

        echo "::error::apt step failed after ${ATTEMPTS} attempts: ${CUSTOM_CMD:-$PACKAGES}"
        exit 1
